name: deploy the calculator

# The hosted calculator, to Cloud Run, in the two regions
# docs/hosting-the-calculator.md §5 settles on: us-central1 and europe-west3.
#
# Three triggers, and the middle one is a decision rather than a convenience:
#
#   push        — the source changed, so rebuild and ship it.
#   schedule    — the source did NOT change, and the image is stale anyway.
#                 The base is python:3.12-slim and the service installs one
#                 wheel, so essentially the whole attack surface is the base,
#                 and a base image ages on its own schedule. §10 takes the
#                 decision to rebuild weekly — and to DEPLOY the rebuild,
#                 because a weekly build that produces a fresh image and never
#                 ships it leaves the running service ageing exactly as fast as
#                 it would have without it. That is theatre, not a control.
#   dispatch    — for the switchover, when a deploy has to happen on demand.
#
# It is safe to deploy on a schedule with nobody watching precisely because the
# gates below are the ones that would catch a real breakage: the image must
# refuse to start without a secret, run non-root, refuse an unauthenticated
# request, return a real figure for an authenticated one, refuse issue text,
# log none of it, and carry no fixable HIGH or CRITICAL vulnerability. Every one
# of those runs before a single byte is pushed to a registry.

on:
  push:
    branches: [main]
    paths:
      - 'service/**'
      - 'agent/tools/**'
      - '.github/workflows/deploy.yml'
  schedule:
    # Mondays, 03:00 UTC. Weekly rather than daily because this service has no
    # dependencies of its own to churn, and a daily rebuild of an unchanged
    # Dockerfile produces noise that gets muted — which is worse than a slower
    # cadence somebody still reads.
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  # Workload Identity Federation: GitHub mints a short-lived OIDC token saying
  # which repository is running, and Google exchanges it for a short-lived
  # access token. This is the line that makes that possible, and it is why there
  # is no service account key in this repository to leak or to rotate.
  id-token: write

concurrency:
  # A scheduled rebuild landing on top of a push would have two deploys racing
  # for the same revision. Queue them instead, and never cancel one midway —
  # a half-applied Cloud Run deploy is a worse state than a slow one.
  group: deploy-calculator
  cancel-in-progress: false

env:
  AR_REPO: calculator
  SERVICE: calculator

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Until service/provision-gcp.sh has been run there is nowhere to deploy to,
    # and a workflow that fails for that reason on every push trains people to
    # ignore a red tick. It skips instead, and says so in the summary.
    if: vars.GCP_PROJECT_ID != ''
    steps:
      - uses: actions/checkout@v7

      # Dated, so a running revision can be aged at a glance in the console
      # without cross-referencing a commit. The SHA tag is what actually gets
      # deployed; the date tag is for the human reading the registry.
      - name: Name the image
        id: name
        run: |
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Build
        run: docker build -f service/Dockerfile -t calculator:local .

      # The same script the `container` job in ci.yml runs. On a push this is
      # the second time it has run; on the weekly rebuild it is the only time,
      # and it is the reason the schedule can deploy unattended.
      - name: It must clear the container checks
        run: bash service/smoke.sh calculator:local
        env:
          SMOKE_PORT: 8080

      - name: It must clear the vulnerability gate
        run: bash service/scan.sh calculator:local

      # Nothing above this line touched Google, and nothing below it runs if
      # anything above failed. The image is proved before it is pushed, not
      # after — a bad image in a registry is one somebody can still deploy.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Push and deploy, one region at a time
        run: |
          set -euo pipefail
          SHA="${{ steps.name.outputs.sha }}"
          DATE="${{ steps.name.outputs.date }}"

          for region in us-central1 europe-west3; do
            host="${region}-docker.pkg.dev"
            repo="${host}/${{ vars.GCP_PROJECT_ID }}/${AR_REPO}/${SERVICE}"

            echo "── ${region} ───────────────────────────────────────────────"
            gcloud auth configure-docker "$host" --quiet

            # Pushed to a registry in the same region the service runs in, so a
            # cold start pulls locally rather than across an ocean. Cold-start
            # latency is a correctness concern here and not only a slow tile:
            # the Forge invocation token lives about 25 seconds and the remote
            # timeout is 25 seconds, so a slow start spends the token's life.
            docker tag calculator:local "${repo}:${SHA}"
            docker tag calculator:local "${repo}:${DATE}"
            docker push "${repo}:${SHA}"
            docker push "${repo}:${DATE}"

            # --min-instances=0 is the whole cost case: this service is idle
            # most of a working day, and an instance that is not a minimum
            # instance and is not serving is billed nothing. Setting it to 1
            # would cost about $9.86/month per region — five times the entire
            # bill at 500,000 calls — so it stays at 0 until p99 latency is an
            # actual complaint rather than an anticipated one. §4.2.
            #
            # --no-allow-unauthenticated is deliberately NOT set. Forge calls
            # this from Atlassian's infrastructure with no Google credential,
            # so IAM cannot be the gate; the gate is the invocation token, which
            # proves both that the call came from Atlassian and that it was
            # minted for this app — strictly more than an IP range or a Google
            # IAM check could prove here. §6.
            #
            # --concurrency=1 because the calculation is CPU-bound, single
            # threaded CPython, and the container runs the stdlib threading
            # server rather than gunicorn. Eight requests sharing one vCPU do
            # not run for free: they contend on the GIL, and eight concurrent
            # intake.sequence calls at 3.07s each would push past the ~25s the
            # invocation token lives. Cloud Run answers a burst by starting more
            # instances instead, which is both faster per request and exactly
            # the model §4.1 costed.
            #
            # --timeout=30s sits just past Forge's own 25s remote timeout: long
            # enough never to cut short a call Forge would still accept, short
            # enough not to keep billing for one Forge has already abandoned.
            #
            # No --execution-environment, so this takes the default. gen2 buys
            # capabilities this service does not use and starts more slowly,
            # and cold start is the budget that matters here.
            gcloud run deploy "$SERVICE" \
              --image="${repo}:${SHA}" \
              --region="$region" \
              --project="${{ vars.GCP_PROJECT_ID }}" \
              --service-account="${{ vars.GCP_RUNTIME_SA }}" \
              --allow-unauthenticated \
              --min-instances=0 \
              --max-instances=50 \
              --cpu=1 \
              --memory=512Mi \
              --concurrency=1 \
              --timeout=30s \
              --set-env-vars="SERVICE_AUTH=shared-secret" \
              --set-secrets="SERVICE_SHARED_SECRET=calculator-shared-secret:latest" \
              --quiet

            url=$(gcloud run services describe "$SERVICE" --region="$region" \
                    --project="${{ vars.GCP_PROJECT_ID }}" --format='value(status.url)')
            echo "deployed: $url"
            echo "URL_$(echo "$region" | tr 'a-z-' 'A-Z_')=$url" >> "$GITHUB_ENV"

            # The one thing worth checking from outside: it is actually serving.
            # /healthz needs no auth and touches no data, which is what makes it
            # usable as a post-deploy probe at all.
            curl -fsS --retry 5 --retry-delay 3 "${url}/healthz"
            echo
          done

      - name: Say where it went
        run: |
          {
            echo "### Calculator deployed"
            echo
            echo "| Region | URL |"
            echo "|---|---|"
            echo "| us-central1 | ${URL_US_CENTRAL1:-not reported} |"
            echo "| europe-west3 | ${URL_EUROPE_WEST3:-not reported} |"
            echo
            echo "Running \`SERVICE_AUTH=shared-secret\`, which is step 3 of"
            echo "\`docs/hosting-the-calculator.md\` §13 — hosting proved on its"
            echo "own, before Forge is anywhere near it. Step 5 switches both"
            echo "services to \`forge-token\`, after which the shared secret is"
            echo "deleted and the service holds no credential at all."
          } >> "$GITHUB_STEP_SUMMARY"

  skipped:
    runs-on: ubuntu-latest
    if: vars.GCP_PROJECT_ID == ''
    steps:
      - name: Nothing to deploy to yet
        run: |
          {
            echo "### Deploy skipped"
            echo
            echo "No \`GCP_PROJECT_ID\` repository variable, so Google Cloud has"
            echo "not been provisioned yet. Run:"
            echo
            echo '```bash'
            echo "bash service/provision-gcp.sh"
            echo '```'
            echo
            echo "It creates the project's registries, service accounts and the"
            echo "GitHub federation, and sets the four variables this workflow"
            echo "reads. Nothing is deployed until it has run."
          } >> "$GITHUB_STEP_SUMMARY"
