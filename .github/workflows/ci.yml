name: build & test

on:
  push:
    branches: [main]
  pull_request:

# Actions are pinned to a major and moved deliberately. These were bumped
# because GitHub deprecated the Node 20 runtime and was force-running the old
# majors on Node 24 — a warning on every run, and a forcing that eventually
# stops. Nothing here uses an input that changed across those majors; the
# usages are checkout, a Python version, and a name-and-path upload.
#
# `pages.yml` moved with them and is `workflow_dispatch` only, so no push
# exercises it. Those three bumps are unverified until somebody publishes.

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build
        run: python3 build.py

      - name: Fail if dist/ was not committed after a src/ change
        run: python3 build.py --check

      - name: Install browser test dependencies
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Agent tool tests (facts, forecast, intake, refusals, backtest)
        run: python3 tests/test_agent.py

      - name: End-to-end browser tests
        run: python3 tests/e2e.py

      - name: Accessibility tests (WCAG 2.2 AA)
        run: python3 tests/a11y.py

      - name: Security tests
        run: python3 tests/security.py

      - name: Hosted calculator tests (projection, refusals, no arithmetic)
        run: |
          pip install -r service/requirements.txt
          python3 tests/test_service.py

      - name: Python dependency audit
        run: |
          pip install pip-audit
          pip-audit -r scripts/requirements.txt
          pip-audit -r service/requirements.txt

      - name: Upload the rendered page
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rendered-dashboard
          path: |
            dist/delivery-value-dashboard.html
            tests/last-run.png

  # The calculator ships as a container, so the container is what gets tested —
  # not just the Python inside it. This job has caught nothing yet because it is
  # new; what it exists to catch is a Dockerfile that stops copying a file the
  # service imports, which passes every other suite in this repository.
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build the calculator image
        run: docker build -f service/Dockerfile -t delivery-value-calculator:ci .

      # The assertions live in service/smoke.sh rather than here, because the
      # weekly rebuild in deploy.yml has to clear the same bar before it ships
      # an image built from a base that moved on its own. Two copies would be
      # two things to keep in step.
      - name: It must clear the container checks
        run: bash service/smoke.sh delivery-value-calculator:ci

      # The policy is in service/scan.sh: fixable HIGH and CRITICAL block,
      # unfixable ones are printed and do not. Both passes run, so what the
      # gate declined to block on is on the log rather than dropped quietly.
      - name: It must clear the vulnerability gate
        run: bash service/scan.sh delivery-value-calculator:ci
