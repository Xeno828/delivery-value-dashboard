name: build & test

on:
  push:
    branches: [main]
  pull_request:

# Actions are pinned to a major and moved deliberately. These were bumped
# because GitHub deprecated the Node 20 runtime and was force-running the old
# majors on Node 24 — a warning on every run, and a forcing that eventually
# stops. Nothing here uses an input that changed across those majors; the
# usages are checkout, a Python version, and a name-and-path upload.
#
# `pages.yml` moved with them and is `workflow_dispatch` only, so no push
# exercises it. Those three bumps are unverified until somebody publishes.

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build
        run: python3 build.py

      - name: Fail if dist/ was not committed after a src/ change
        run: python3 build.py --check

      - name: Install browser test dependencies
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Agent tool tests (facts, forecast, intake, refusals, backtest)
        run: python3 tests/test_agent.py

      - name: End-to-end browser tests
        run: python3 tests/e2e.py

      - name: Accessibility tests (WCAG 2.2 AA)
        run: python3 tests/a11y.py

      - name: Security tests
        run: python3 tests/security.py

      - name: Routes and resolver tests (projection, refusals, jobs, no arithmetic)
        run: python3 tests/test_service.py

      # The runtime the Forge function ships, which is Node 24 on Forge. The
      # pinned pyodide package is fourteen megabytes and the lockfile keys the
      # cache, so it downloads once per pin rather than once per push.
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: forge/package-lock.json

      - name: Install the Forge app's dependencies, including the pinned Python runtime
        run: npm ci --prefix forge --no-fund --no-audit

      # The same Python under WebAssembly, byte for byte against native. This
      # regenerates forge/src/assets.js from the tree, so it is also the test
      # that the generator a deploy runs still runs. ADR 0031.
      - name: WebAssembly parity tests (the tools under Pyodide equal the tools natively)
        run: python3 tests/test_wasm.py

      - name: Python dependency audit
        run: |
          pip install pip-audit
          pip-audit -r scripts/requirements.txt

      - name: Upload the rendered page
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rendered-dashboard
          path: |
            dist/delivery-value-dashboard.html
            tests/last-run.png
