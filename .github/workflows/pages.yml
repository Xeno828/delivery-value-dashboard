name: publish to GitHub Pages

# Publishes the built dashboard with its demo dataset. Do NOT run this on a
# repository whose data/ folder contains real issue titles — Pages is public
# unless your plan supports private Pages.
#
# Manual only, deliberately. This job copies all of data/ into a public site,
# so the decision to publish is made per-run by a person, never by a push.

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python3 build.py
      - name: Stage the site
        run: |
          mkdir -p _site
          cp dist/delivery-value-dashboard.html _site/index.html
          cp -r data _site/data
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v5
