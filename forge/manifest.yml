# Forge app manifest.
#
# This is the second of the two routes in roadmap item 1. The other is OAuth
# 2.0 (3LO) in scripts/jira_auth.py, which is live and tested and is not going
# away — it needs no app registration and is the right thing for pulling your
# own board.
#
# What is real: the app is registered, `forge lint` is clean, and it deploys to
# development and installs on a dev site. The dashboard renders inside the
# iframe and reads the tenant's own boards, sprints and issues over the bridge
# in forge/bridge/bridge.js.
#
# The hosted calculator is provisioned and the forecast is wired to it. Two
# Cloud Run services, region-pinned below, both running SERVICE_AUTH=forge-token
# so the app holds no secret of its own. tests/test_service.py ties the URL and
# the resolver together, so a real baseUrl with the offline refusal still in
# place — or the reverse — fails rather than shipping.
#
# Sequencing still refuses, and for a different reason that is not hosting: a
# Jira site has no way to record an ask, so there is nothing to sequence. The
# resolver says which of the two it is.

modules:
  jira:projectPage:
    - key: delivery-value-dashboard
      resource: main
      resolver:
        function: resolver
      title: Delivery & Value


  # Connection check, not the product. Delete this module and forge/probe/ once
  # the real bridge exists. It is an adminPage rather than a second projectPage
  # because Forge permits only one of the latter — and because a page that dumps
  # board contents and outbound payloads belongs behind Jira's admin gate rather
  # than in front of every project's team.
  jira:adminPage:
    - key: connection-check
      resource: probe
      resolver:
        function: resolver
      title: Shipping Forecast — connection check

  # The brief is written by an Atlassian-hosted model, in Atlassian's runtime,
  # with no egress. That is the whole reason roadmap item 3 does not send the
  # tenant's issue titles to a third party to get a paragraph back: the obvious
  # implementation is an API key and a declared egress, and this is the one that
  # does not cross the boundary. `claude` is the only family offered.
  #
  # Declaring this module is a MAJOR VERSION upgrade and therefore a forced
  # reinstall for every tenant. Free today because there are no external
  # installs, and expensive after the first — which is why it lands now rather
  # than when the mail side is ready. docs/adr/0013.
  llm:
    - key: brief-writer
      model:
        - claude

  # Business value, declared rather than created — roadmap item 7, ADR 0025.
  #
  # Jira has no native field for what a piece of work is worth, so every Forge
  # tenant has reported `valueDelivered` as *absent* rather than nil since the
  # series was built. This is the field that makes it a figure.
  #
  # **Declared, not created.** A `jira:customField` module makes Jira create a
  # locked instance of the field on install. Creating one through
  # `POST /rest/api/3/field` would need *Administer Jira*, which ADR 0020 and
  # ADR 0021 both refused — so this needs no scope the app did not already hold.
  #
  # Not `readOnly`, so a person edits it in Jira's own UI. The app never writes
  # it, which is why there is no `write:` scope here: value is a judgement made
  # by whoever is accountable for it, and an app that wrote it would be making
  # that judgement.
  #
  # **A Jira admin must add it to a screen before anyone can fill it in.** The
  # module cannot do that and no scope grants it. The tile says so, and says it
  # differently from "nobody has entered a value yet", because those have
  # different fixes.
  #
  # Nothing here restricts which issue types carry it — the manifest has no such
  # property. Which levels *count* is `orgConfig.valueFromHierarchy`, applied by
  # the tools, because relying on the customer's field context would be relying
  # on their configuration to prevent a double count.
  #
  # Declaring this module is a MAJOR VERSION upgrade and a forced reinstall for
  # every tenant — free today with no external installs, expensive after the
  # first, which is why it lands now. The same argument the `llm` module above
  # was added under.
  jira:customField:
    - key: business-value
      name: Business Value
      description: >-
        What this piece of work is worth, in the currency this board reports in.
        Filled in on epics and above; a value on a story below an epic that also
        carries one would be counted twice, so it is not counted at all.
      type: number
    # **The sentence under the number.** ADR 0027.
    #
    # `valueBasis` has been in the schema, the importer, the value tile and the
    # security suite since long before any of it reached Jira, and on Forge it
    # was hardcoded to `''` because no field carried one. This is that field.
    #
    # **Free text, and that is the design rather than the cheap option.** Nothing
    # sizes, ranks or scores on this string — `intake.sequence` carries it
    # through untouched and prints it beside each ordering's delivery
    # consequence, because the ordering's cost is computable and the worth of the
    # thing ordered is not. An enumeration here would be one join away from a
    # weight, and a weight is the priority score ADR 0004 refuses.
    #
    # Everything the field above says about declaration applies unchanged: Jira
    # creates it, the app never writes it, and an admin must add it to a screen
    # before anyone can type in it. It is a *separate* screen configuration from
    # the value field's, so a tenant can easily have one and not the other.
    #
    # It never leaves the tenant. `valueBasis` is in `NEVER_SEND` in
    # `forge/src/index.js` and in `FREE_TEXT_FIELDS` in `service/app.py`, so the
    # calculator gets the number with no sentence beside it and no issue key —
    # a rule that predates this field and is the reason declaring it costs no
    # new egress. ADR 0025 made that argument for the number; it is stronger
    # here, because prose about why work matters is the most quotable thing in
    # a customer's backlog.
    - key: value-basis
      name: Value Basis
      description: >-
        Why the Business Value figure beside it is what it is — one sentence a
        reader can challenge. A number with no basis is a figure someone will
        quote back at you. Not read by any calculation; shown next to the value
        it explains.
      type: string
    # **Which epics are being weighed against each other.** ADR 0028.
    #
    # Sequencing compares orderings of *asks*. Candidacy is a state and not a
    # type: an epic already committed and half built is not being weighed
    # against anything, so "every epic" would sequence decisions already taken —
    # which is worse than refusing, because it would look like advice.
    #
    # **Text, because Forge cannot declare a checkbox.** `jira:customField`
    # offers number, string, user, group, date and datetime; the object variants
    # need a custom UI. Creating a native Jira checkbox needs *Administer Jira*,
    # which ADR 0020 refused and ADR 0021 refused again. So this is a field
    # somebody types Yes into, and `orgconfig.candidate_answer` reads Yes, Y or
    # True — and reports anything else as unrecognised rather than as a no,
    # because "Maybe" is somebody trying to say something.
    #
    # **And no site has to use it.** `orgConfig.askField` names any field the
    # site already has — a checkbox, a single select, a discovery flag — and the
    # app reads that instead. Candidacy is the one thing every organisation
    # defines differently; this is a default, not a convention anyone must
    # adopt.
    - key: candidate
      name: Candidate
      description: >-
        Whether this is being weighed against other candidates for sequencing,
        rather than work already committed. Yes, Y or True; anything else is
        reported as unrecognised rather than read as no. Filled in on epics and
        above.
      type: string
    # **How big, in this board's own terms.** ADR 0029.
    #
    # A band is a *selector*, not a number: `tshirt_scale` builds S/M/L/XL from
    # quartiles of the epics this board has actually completed, so "L" means
    # "like this board's third-quartile epics" and never a figure somebody wrote
    # in a table. An optimist who calls everything S still gets a distribution
    # made of real item counts, which is what separates this from estimating in
    # points — the judgement picks a reference class, it does not invent a size.
    #
    # Optional everywhere. An ask with no band is sized off the board's whole
    # reference class, which is what every ask did before this existed, and the
    # row says which of the two it was.
    #
    # Needs more history than a plain reference class does — eight completed
    # epics against five, because it is split four ways — and the refusal says
    # so in those words when a board has too few.
    #
    # Text, for the same reason the Candidate field is: Forge cannot declare a
    # select. `orgConfig.sizeField` points at a field the site already has, and
    # a real select or checkbox is the better control wherever somebody has one.
    - key: tshirt-size
      name: T-Shirt Size
      description: >-
        How big this is in this board's own terms: S, M, L or XL, calibrated
        from the epics this board has already completed. Optional — without it
        an ask is compared against every completed epic rather than one band.
      type: string

  function:
    - key: resolver
      handler: index.handler
      # The resolver function now loads the Python runtime from a memory
      # snapshot to validate a sequencing request (ADR 0031), and will answer
      # facts, the forecast, history and the burndown the same way, route by
      # route. Measured RSS after the load is 347 MB; the platform's default
      # is 512 MB, and a function that ran out of memory on a large board
      # would fail inside a tenant with nothing here to have said so. The
      # ceiling, then — the same figure the probe measured under.
      runtime:
        memoryMB: 1024
    # The sequencing consumer's function. ADR 0031.
    #
    # Sequencing is cubic in the ask count — twelve asks is 209 seconds on
    # this CPU — so the `sequence` resolver validates and pushes an event, and
    # this function computes it under the platform's ceiling rather than the
    # resolver's 25 seconds. 900 is the ceiling and not the need, because
    # Forge bills measured time on a run that finishes, and a slower container
    # than the probe's is the one unknown left; the cap on asks is the guard
    # against a run that cannot finish. A memory of 1,024 MB for the same
    # reason. Adding this function and the consumer below is a MINOR version,
    # settled by deploy on the second probe; so is a change to timeoutSeconds.
    - key: sequence-fn
      handler: index.sequenceConsumer
      timeoutSeconds: 900
      runtime:
        memoryMB: 1024
    # The scheduled trigger's own function, and it must be its own.
    #
    # This trigger pointed at `resolver` from the day it was declared. A
    # scheduled trigger invokes a function directly with an event; the resolver
    # handler is a dispatcher expecting `{ call: { functionKey } }` and does not
    # recognise one. It fired twice on 2026-08-24 and threw both times —
    # `TypeError: Cannot read properties of undefined (reading 'functionKey')`.
    # Nothing surfaced it: a scheduled trigger is not retried and its failure
    # appears nowhere a person looks. tests/test_service.py holds the two apart.
    #
    # Confirmed working on 2026-08-26 by temporarily setting `fiveMinute`:
    # three fires five minutes apart, INFO rather than ERROR, the handler's own
    # refusal. An interval change is a minor version, so that test costs a
    # deploy and no reinstall. docs/forge-deployment.md §4.
    - key: weekly-brief-fn
      handler: index.weeklyBrief
      # Longer than the default because this one reads a board, calls the
      # calculator and waits on a model. It currently returns in milliseconds —
      # it refuses before doing any of that — but the budget is set for the work
      # it will do rather than the work it does while unfinished.
      timeoutSeconds: 120

  # Roadmap item 3 (scheduled delivery). Declared before it does anything,
  # because the permission is easier to argue for once, at listing time, than to
  # add later.
  #
  # It fires weekly and currently refuses: there is no board configured to
  # report on, no recipients, and no mail transport. It checks all three before
  # making a single Jira call, so a run that cannot deliver costs one invocation
  # rather than a board's worth of reads and a model completion nobody receives.
  scheduledTrigger:
    - key: weekly-brief
      function: weekly-brief-fn
      interval: week

  # The queue the `sequence` resolver pushes to and the function that drains
  # it. The queue name is `QUEUE_KEY` in forge/src/jobs.js, and
  # tests/test_service.py holds the two strings together, because a queue
  # named here and misspelt there is an event pushed to a queue nobody
  # consumes — accepted by the platform, run by nothing, and invisible.
  consumer:
    - key: sequence-consumer
      queue: sequence-jobs
      function: sequence-fn

# Produced by `make forge-static`. Both paths are git-ignored: they are built
# from sources this repository already commits, and a second copy is a second
# thing that can go stale. Build before you lint or deploy — `forge lint`
# reports a missing resource, not a missing build step.
#
# `main` is not a copy of dist/. It is `build.py --split`, because this iframe's
# CSP blocks inline style and script; it is seeded from forge/seed.json rather
# than the demo dataset, because the tenant's own sprints are the point; and it
# links forge/bridge/bridge.js ahead of app.js, which is how the page finds a
# transport without importing one.
resources:
  - key: main
    path: static/dashboard/build
  # Bundled by `make forge-static`: @forge/bridge is CommonJS, so a Custom UI
  # resource that calls invoke() has to be built rather than copied. That is the
  # platform's model, not a choice this repository made.
  - key: probe
    path: static/probe

# The hosted calculator — service/app.py. Forge cannot run agent/tools/, so it
# posts the fields a calculation reads and gets the figures back, rather than a
# second Monte Carlo being written in JavaScript. ADR 0008 has the reasoning and
# the measurements.
#
# What attaches the Atlassian-issued invocation token is `invokeRemote` in
# forge/src/index.js — not this declaration. The comment here used to say the
# opposite, and the code it described called plain `fetch` against a URL out of
# the environment, which sends no Authorization header at all: pointing baseUrl
# at a real host would have returned 401 on every call, in either of the
# service's auth modes. Declaring the remote is what makes the egress
# permitted; that is a different claim and it was the one being made.
#
# `operations: [compute]` does two jobs. Forge requires it before `invokeRemote`
# will resolve this key at all, and it is the declaration that this remote
# processes data without storing any. With `operations` absent Forge assumes the
# opposite — that the app stores end-user data here — which is the worst
# available reading of a service whose entire argument is that it stores
# nothing, and it would cost the app its data-residency PINNED status.
#
# There is no `permissions.external.fetch` entry any more, because nothing
# fetches. It was the egress rule for the `fetch` call that is gone.
#
# `baseUrl` becomes an object of region-specific URLs at switchover, resolved
# per install from the customer's own residency setting, so this app never picks
# a tenant's region. Converting the format is a major version change and a
# reinstall, so it lands once, with the real URLs and with the refusals in
# forge/src/index.js removed in the same commit — tests/test_service.py asserts
# those two move together. docs/hosting-the-calculator.md §5, ADR 0012.
remotes:
  - key: calculator
    # Region-pinned. Forge picks one of these per installation from the
    # customer's own Atlassian data residency setting, so this app never
    # decides which region a tenant's numbers are computed in — the half of
    # residency that would otherwise have to be built. docs/adr/0012.
    #
    # All three hostnames are live. US and EU were verified end to end on
    # 2026-08-25; GB — London, europe-west2 — was added 2026-08-31, because the
    # United Kingdom is its own Atlassian realm (EU is Frankfurt and Dublin) and
    # the first customer is a UK company. Pointing GB at the EU service would
    # have been one line and a quiet lie. docs/adr/0030.
    #
    # A realm declared here with no region behind it fails the deploy workflow:
    # its regions and these realms are two halves of one fact, and the failure
    # they prevent is a tenant reading answers from a calculator that stopped
    # being updated.
    #
    # These are the values `gcloud run services describe` reports as
    # `status.url`; Cloud Run also publishes a
    # `calculator-<project-number>.<region>.run.app` form for each, and either
    # would work. Changing which is used later is a major version change and a
    # reinstall for every tenant, so it is chosen once, here.
    baseUrl:
      default: https://calculator-jtfw7qf4ea-uc.a.run.app
      US: https://calculator-jtfw7qf4ea-uc.a.run.app
      EU: https://calculator-jtfw7qf4ea-ey.a.run.app
      GB: https://calculator-jtfw7qf4ea-nw.a.run.app
    operations:
      - compute

permissions:
  scopes:
    # Read-only, and every one of them is asserted read-only on every push —
    # an app that asks for write access to close a deal is one whose consent
    # screen stops a security reviewer.
    #
    # Two vocabularies are present. The granular pair came from `forge lint
    # --fix`; the classic pair is the equivalent the 3LO client in
    # scripts/jira_auth.py uses, and the two routes must not end up seeing
    # different issues.
    #
    # OPEN: this currently requests the union of both, which is broader than
    # needed and shows up as extra lines on the consent screen. Drop the classic
    # pair once a real install confirms the granular two cover the board paging
    # in src/index.js — not before, because losing board access fails at runtime
    # in a tenant rather than at build time here.
    - read:board-scope:jira-software
    # Epics are not on a scrum board and never come back from a sprint fetch —
    # "Epic issues do not belong to the scrum boards" is Jira's own description
    # of the design. Business value lives on epics (ADR 0025), so reading them
    # is what makes the field's value reach a figure at all. Read-only, like
    # every other scope here, and `forge lint` is what found it missing rather
    # than a tenant reporting no value. ADR 0026.
    - read:epic:jira-software
    - read:issue-details:jira
    - read:jira-work
    - read:jira-user
    # Added deliberately, and it is the scope this app removed once already.
    #
    # A `boards` resolver was dropped from the connection check rather than
    # granted this, on the grounds that it existed only to make a diagnostic
    # more convenient. The note it left said: "if the real context picker ever
    # needs to enumerate boards, read:project:jira is the price, and that is a
    # decision to take on its own merits."
    #
    # This is that moment. The product's context picker offers the boards of
    # the project the page is open in, and GET /rest/agile/1.0/board needs
    # this. Without it the alternative is a page that opens empty and asks an
    # end user to type a numeric board id, which is a diagnostic, not a
    # product. Still read-only, still one line on the consent screen.
    # ADR 0009 has the reasoning.
    - read:project:jira
    # Both demanded by `forge lint` for GET /board/{id}/sprint/{sid}/issue —
    # the one call that reads a sprint's issues, which is the product. There is
    # no cheaper endpoint: the board-issue endpoint returns what is on the
    # board now, not what a closed sprint contained, and recovering the sprint
    # from an issue means reading a custom field whose id differs per site.
    #
    # read:jql:jira looks broader than the rest and is worth understanding
    # rather than waving through: that agile endpoint is JQL-backed underneath,
    # so Atlassian requires the JQL read scope for it. It is still read-only,
    # and this app issues no JQL of its own — the only queries it makes are the
    # four routes in src/index.js, none of which takes a query from the page.
    - read:sprint:jira-software
    - read:jql:jira
    # ---- not read-only, and each one is here with a reason -------------
    #
    # Until 1.26.0 every scope in this file began with `read:` and a test
    # asserted it. These two do not, so the test became an allow-list in which a
    # non-read scope must appear with its justification. The rule was never
    # "read: is a nice prefix" — it was that adding reach is a deliberate edit
    # somebody has to argue for. ADR 0014.
    #
    # The send itself. There is no read-only way to send mail, and this is what
    # keeps the brief inside Atlassian rather than handing issue titles to a
    # mail provider. It grants no read or write of issue data, and it cannot
    # address anyone outside this site: the notify endpoint takes Jira
    # accountIds and groups, and has no field for an email address.
    - send:notification:jira
    # The app's own key-value store, which is where a board's recipient list
    # lives. It grants no access to any Jira data at all — it is this app's own
    # shelf. The alternative was a Jira project property, which would have meant
    # write access into the customer's project to save a setting; ADR 0014 has
    # why that trade goes the other way.
    - storage:app

app:
  runtime:
    name: nodejs22.x

# Egress costs the "Runs on Atlassian" badge. It is the price of reaching one
# implementation of the forecast over a remote — and since 2026-09-01 it is no
# longer the only way to keep one implementation. The tools run unchanged
# under WebAssembly inside a Forge function, measured on a throwaway app:
# byte-identical figures, no egress, at roughly ten times the CPU time and
# with sequencing on the edge of the resolver timeout. ADR 0008's amendment
# has the price. The calculator stands until that trade is taken, so the badge
# is still forfeit here — as a decision, not a discovery at listing time.
#
# Deliberately absent from what is committed: an `id`. Running `forge register`
# writes one, and it ties this manifest to one developer's Atlassian account.
# Having one locally is the correct state for anyone who has registered;
# committing it would hand everyone who clones the repository a manifest
# pointing at somebody else's app. Strip it before `git add`, restore it after
# — tests/test_service.py checks HEAD, not the working tree.
