# Forge app manifest — SCAFFOLD, NOT WIRED UP.
#
# This is the second of the two routes in roadmap item 1. The working route is
# OAuth 2.0 (3LO) in scripts/jira_auth.py, which is live and tested. This
# directory exists so the Forge option stays a decision rather than a rewrite,
# and so the scope list and the resolver boundary are written down while the
# reasons are fresh.
#
# It has never been deployed, and no app has been registered. The resolver it
# points at is real — it projects, calls the calculator and re-attaches the
# summaries — but the Forge-specific syntax below has never been run through
# `forge lint`. Check it against current Atlassian docs before trusting it;
# platform manifest schemas move. See forge/README.md.

modules:
  jira:projectPage:
    - key: delivery-value-dashboard
      resource: main
      resolver:
        function: resolver
      title: Delivery & Value

    # Connection check, not the product. Delete this module and forge/probe/
    # once the real bridge exists — it answers the questions a deploy leaves
    # open, and nothing after that.
    - key: connection-check
      resource: probe
      resolver:
        function: resolver
      title: Shipping Forecast — connection check

  function:
    - key: resolver
      handler: index.handler

  # A scheduled trigger is what roadmap item 3 (scheduled delivery) would hang
  # off. Declared here because the permission it needs is easier to argue for
  # once, at listing time, than to add later.
  scheduledTrigger:
    - key: weekly-brief
      function: resolver
      interval: week

# Produced by `make forge-static`, which stages dist/ into this path. It is
# git-ignored: it is a copy of an artefact this repository already commits, and
# a second copy is a second thing that can go stale. Build before you lint or
# deploy — `forge lint` reports a missing resource, not a missing build step.
#
# Staging it makes the page render. It does not make the page work: the built
# file reaches live mode over same-origin `api/*`, and inside a Forge iframe
# there is no such endpoint. Until the resolver is wired to the bridge the
# forecast tile shows its offline notice, which is the honest failure but not a
# shippable one.
resources:
  - key: main
    path: static/dashboard/build
  # Bundled by `make forge-static`: @forge/bridge is CommonJS, so a Custom UI
  # resource that calls invoke() has to be built rather than copied. That is the
  # platform's model, not a choice this repository made.
  - key: probe
    path: static/probe

# The hosted calculator — service/app.py. Forge cannot run agent/tools/, so it
# posts the fields a calculation reads and gets the figures back, rather than a
# second Monte Carlo being written in JavaScript. ADR 0008 has the reasoning and
# the measurements. Declaring it as a `remote` rather than a bare egress URL is
# what gets each call an Atlassian-issued invocation token, so the service can
# tell which tenant is asking without this app holding a secret.
remotes:
  - key: calculator
    baseUrl: https://calculator.example.invalid

permissions:
  external:
    fetch:
      backend:
        - remote: calculator
  scopes:
    # Read-only, and every one of them is asserted read-only on every push —
    # an app that asks for write access to close a deal is one whose consent
    # screen stops a security reviewer.
    #
    # Two vocabularies are present. The granular pair came from `forge lint
    # --fix`; the classic pair is the equivalent the 3LO client in
    # scripts/jira_auth.py uses, and the two routes must not end up seeing
    # different issues.
    #
    # OPEN: this currently requests the union of both, which is broader than
    # needed and shows up as extra lines on the consent screen. Drop the classic
    # pair once a real install confirms the granular two cover the board paging
    # in src/index.js — not before, because losing board access fails at runtime
    # in a tenant rather than at build time here.
    - read:board-scope:jira-software
    - read:issue-details:jira
    - read:jira-work
    - read:jira-user

app:
  runtime:
    name: nodejs22.x
# Egress costs the "Runs on Atlassian" badge. That is a real marketing loss
# with no engineering answer, and it is the price of not having two
# implementations of the forecast. It is written down in ADR 0008 so the
# trade is a decision rather than a discovery at listing time.
#
# Deliberately absent: an `id`. Running `forge register` writes one, and it ties
# this manifest to one developer's Atlassian account. Committing that id would
# hand everyone who clones the repository a manifest pointing at somebody
# else's app.
